
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b18">
<title>Time Since No Contact</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #090b18;
    --text: #f5f3ff;
    --muted: #a5a4bd;
    --violet: #b6a0ff;
    --cyan: #8de8ef;
    --line: rgba(255,255,255,.12);
    --mono: "DM Mono", monospace;
    --sans: "Manrope", sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    display: grid;
    place-items: center;
    padding: clamp(18px, 4vw, 56px);
    color: var(--text);
    font-family: var(--sans);

    background:
        radial-gradient(ellipse at 12% 12%, rgba(105,76,180,.25), transparent 38%),
        radial-gradient(ellipse at 88% 78%, rgba(33,128,150,.18), transparent 38%),
        #090b18;
}

/* BACKGROUND EFFECTS */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    opacity: .23;

    background-image:
        radial-gradient(rgba(255,255,255,.8) .7px, transparent .7px);

    background-size: 34px 34px;
}

.aurora {
    position: fixed;
    z-index: -1;
    width: min(65vw, 760px);
    aspect-ratio: 1;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .15;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
}

.aurora.one {
    background: #7958d8;
    top: -35%;
    left: -18%;
}

.aurora.two {
    background: #2e9aa7;
    right: -25%;
    bottom: -42%;
    animation-delay: -8s;
}

@keyframes drift {
    from {
        transform: translate(-3%, 0) scale(.9);
    }
    to {
        transform: translate(8%, 12%) scale(1.12);
    }
}

/* FLOATING PARTICLES */

#particles {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    bottom: -20px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #cfc3ff;
    box-shadow: 0 0 12px #b6a0ff;

    animation: floatUp var(--duration) linear infinite;
    animation-delay: var(--delay);
    left: var(--left);
}

@keyframes floatUp {
    0% {
        transform: translate(0,0) scale(.5);
        opacity: 0;
    }

    12% {
        opacity: .65;
    }

    85% {
        opacity: .3;
    }

    100% {
        transform: translate(var(--drift),-110vh) scale(1.3);
        opacity: 0;
    }
}

/* LOADING SCREEN */

.intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: #090b18;
    transition: opacity .9s ease, visibility .9s ease;
}

.intro.hidden {
    opacity: 0;
    visibility: hidden;
}

.intro-inner {
    text-align: center;
    animation: introIn 1s ease both;
}

.intro-mark {
    font-size: 2rem;
    color: var(--violet);
    animation: heartbeat 1.8s ease-in-out infinite;
}

.intro-text {
    margin-top: 16px;
    color: #c6c0dc;
    font: 11px var(--mono);
    letter-spacing: .28em;
    text-transform: uppercase;
}

.intro-line {
    width: 150px;
    height: 1px;
    margin: 20px auto;
    background: #ffffff20;
    overflow: hidden;
}

.intro-line::after {
    content: "";
    display: block;
    height: 100%;
    width: 40%;
    background: linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        transparent
    );
    animation: loading 1.3s ease-in-out infinite;
}

@keyframes introIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes loading {
    from { transform: translateX(-110%); }
    to { transform: translateX(360%); }
}

@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
        opacity: .7;
    }
    50% {
        transform: scale(1.17);
        opacity: 1;
    }
}

/* MAIN CONTENT */

main {
    width: min(1120px, 100%);
    margin: auto;
    text-align: center;

    opacity: 0;
    transform: translateY(18px);

    transition:
        opacity 1s ease .15s,
        transform 1s ease .15s;
}

main.ready {
    opacity: 1;
    transform: translateY(0);
}

.topline {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    color: #b7b2ce;
    font: 10px var(--mono);
    letter-spacing: .22em;
    text-transform: uppercase;
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #8ce5c2;
    box-shadow: 0 0 0 0 rgba(140,229,194,.5);
    animation: livePulse 2s infinite;
}

@keyframes livePulse {
    70% {
        box-shadow: 0 0 0 8px rgba(140,229,194,0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(140,229,194,0);
    }
}

h1 {
    margin: 22px 0 12px;
    font-size: clamp(2.5rem, 7.5vw, 6.2rem);
    line-height: .98;
    letter-spacing: -.075em;
    font-weight: 700;

    background: linear-gradient(
        115deg,
        #fff 15%,
        #d8ccff 52%,
        #8de8ef 90%
    );

    color: transparent;
    background-clip: text;
}

.subtitle {
    color: var(--muted);
    font-size: clamp(.9rem, 2vw, 1.05rem);
}

.rule {
    width: 46px;
    height: 1px;
    margin: 30px auto 34px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--violet),
        transparent
    );
}

/* COUNTER CARDS */

.counter {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: clamp(8px, 1.5vw, 16px);
    perspective: 1000px;
}

.unit {
    --mx: 50%;
    --my: 50%;

    position: relative;
    min-width: 0;
    overflow: hidden;

    padding: clamp(18px, 3vw, 32px) 8px;

    border: 1px solid var(--line);
    border-radius: clamp(14px, 2vw, 22px);

    background: linear-gradient(
        145deg,
        rgba(255,255,255,.085),
        rgba(255,255,255,.025)
    );

    box-shadow:
        0 16px 45px rgba(0,0,0,.16),
        inset 0 1px rgba(255,255,255,.06);

    backdrop-filter: blur(16px);

    transform: translateY(24px);
    opacity: 0;

    transition:
        transform .55s cubic-bezier(.2,.8,.2,1),
        border-color .35s,
        box-shadow .35s,
        background .35s,
        opacity .7s;
}

main.ready .unit {
    opacity: 1;
    transform: translateY(0);
}

main.ready .unit:nth-child(1) { transition-delay: .12s; }
main.ready .unit:nth-child(2) { transition-delay: .2s; }
main.ready .unit:nth-child(3) { transition-delay: .28s; }
main.ready .unit:nth-child(4) { transition-delay: .36s; }
main.ready .unit:nth-child(5) { transition-delay: .44s; }
main.ready .unit:nth-child(6) { transition-delay: .52s; }

.unit::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;

    background: radial-gradient(
        260px circle at var(--mx) var(--my),
        rgba(182,160,255,.17),
        transparent 65%
    );

    transition: opacity .35s;
}

.unit::after {
    content: "";
    position: absolute;
    top: 0;
    left: 18%;
    right: 18%;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(141,232,239,.65),
        transparent
    );

    opacity: .55;
}

.unit:hover {
    transform: translateY(-9px) scale(1.025);
    border-color: rgba(182,160,255,.5);

    background: linear-gradient(
        145deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.045)
    );

    box-shadow:
        0 24px 60px rgba(0,0,0,.3),
        0 0 30px rgba(142,117,220,.12);
}

.unit:hover::before {
    opacity: 1;
}

.number {
    position: relative;
    z-index: 1;
    display: block;

    font: 500 clamp(1.65rem, 4.8vw, 4.3rem)/1.1 var(--mono);
    letter-spacing: -.085em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;

    background: linear-gradient(
        130deg,
        #fff 12%,
        #d2c5ff 65%,
        #8de8ef
    );

    color: transparent;
    background-clip: text;

    transition: filter .3s, transform .3s;
}

.unit:hover .number {
    filter: drop-shadow(0 0 12px rgba(182,160,255,.35));
    transform: scale(1.045);
}

.label {
    position: relative;
    z-index: 1;
    display: block;
    margin-top: 13px;

    color: #aaa8c2;
    font: 10px var(--mono);
    letter-spacing: .16em;
}

.changed {
    animation: numberTick .38s ease;
}

@keyframes numberTick {
    0% {
        transform: translateY(-5px);
        opacity: .45;
    }
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

/* DATE AND PROGRESS */

.since {
    margin: 32px auto 0;
    color: #a7a5bd;
    font-size: .88rem;
}

.since strong {
    color: #eeebff;
    font-weight: 600;
}

.progress-wrap {
    width: min(420px, 85%);
    margin: 30px auto 0;
}

.progress-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;

    color: #85839f;
    font: 9px var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
}

.progress-track {
    height: 2px;
    overflow: hidden;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg,#9d83ed,#8de8ef);
    box-shadow: 0 0 12px #9d83ed;
    transition: width .8s ease;
}

.footer {
    margin-top: 55px;
    color: #686982;
    font: 9px var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
}

.footer span {
    color: #a59acb;
}

/* RESPONSIVENESS */

@media (max-width: 760px) {
    .counter {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
    }

    .number {
        font-size: clamp(2rem, 8vw, 3.5rem);
    }

    .unit {
        padding: 24px 8px 20px;
    }
}

@media (max-width: 420px) {
    body {
        padding: 24px 14px;
    }

    .counter {
        gap: 8px;
    }

    .unit {
        border-radius: 14px;
        padding: 20px 4px 17px;
    }

    .number {
        font-size: clamp(1.55rem, 8vw, 2.25rem);
    }

    .label {
        font-size: 8px;
        letter-spacing: .1em;
        margin-top: 10px;
    }

    h1 {
        letter-spacing: -.065em;
    }

    .since {
        font-size: .78rem;
    }
}

/* ACCESSIBILITY */

@media (hover: none) {
    .unit:hover {
        transform: none;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }

    .intro {
        display: none;
    }

    main {
        opacity: 1;
        transform: none;
    }

    .unit {
        opacity: 1;
        transform: none;
    }
}
</style>
</head>

<body>

<div class="aurora one"></div>
<div class="aurora two"></div>

<div id="particles"></div>

<!-- LOADING SCREEN -->
<div class="intro" id="intro">
    <div class="intro-inner">
        <div class="intro-mark">✳</div>
        <div class="intro-text">A moment in time</div>
        <div class="intro-line"></div>
    </div>
</div>

<main id="main">

    <div class="topline">
        <span class="live-dot"></span>
        Still counting
        <span>·</span>
        Still waiting
    </div>

    <h1>Time Since<br>No Contact</h1>

    <p class="subtitle">
        Some moments stay with us.
    </p>

    <div class="rule"></div>

    <!-- COUNTER -->
    <section class="counter">

        <article class="unit">
            <span class="number" id="years">00</span>
            <span class="label">YEARS</span>
        </article>

        <article class="unit">
            <span class="number" id="months">00</span>
            <span class="label">MONTHS</span>
        </article>

        <article class="unit">
            <span class="number" id="days">00</span>
            <span class="label">DAYS</span>
        </article>

        <article class="unit">
            <span class="number" id="hours">00</span>
            <span class="label">HOURS</span>
        </article>

        <article class="unit">
            <span class="number" id="minutes">00</span>
            <span class="label">MINUTES</span>
        </article>

        <article class="unit">
            <span class="number" id="seconds">00</span>
            <span class="label">SECONDS</span>
        </article>

    </section>

    <p class="since">
        Counting since
        <strong id="start-date"></strong>
    </p>

    <div class="progress-wrap">

        <div class="progress-head">
            <span>Time moving forward</span>
            <span id="elapsed">0 days elapsed</span>
        </div>

        <div class="progress-track">
            <div class="progress-bar" id="progress"></div>
        </div>

    </div>

    <div class="footer">
        One second at a time <span>✦</span>
    </div>

</main>

<script>

// ===================================
// STARTING DATE
// ===================================

// The starting moment is June 30, 2025, 9:15 PM in Minnesota.
const startTimeZone = "America/Chicago";
const startDateParts = {
    year: 2025,
    month: 6,
    day: 30,
    hour: 21,
    minute: 15,
    second: 0
};

function getTimeZoneOffset(date, timeZone) {

    const parts = new Intl.DateTimeFormat("en-US", {
        timeZone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
    }).formatToParts(date);

    const values = Object.fromEntries(
        parts.map(part => [part.type, part.value])
    );

    return Date.UTC(
        Number(values.year),
        Number(values.month) - 1,
        Number(values.day),
        Number(values.hour),
        Number(values.minute),
        Number(values.second)
    ) - date.getTime();
}

function dateInTimeZone(parts, timeZone) {

    const utcGuess = Date.UTC(
        parts.year,
        parts.month - 1,
        parts.day,
        parts.hour,
        parts.minute,
        parts.second
    );

    const offset = getTimeZoneOffset(new Date(utcGuess), timeZone);

    return new Date(utcGuess - offset);
}

const startDate = dateInTimeZone(startDateParts, startTimeZone);

document.getElementById("start-date").textContent =
    new Intl.DateTimeFormat(undefined, {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
    }).format(startDate);

const ids = [
    "years",
    "months",
    "days",
    "hours",
    "minutes",
    "seconds"
];

const previous = {};


// ===================================
// HELPER FUNCTIONS
// ===================================

function pad(value) {
    return String(value).padStart(2, "0");
}


// Add calendar months without overflowing
// into the following month.

function addMonths(date, amount) {

    const result = new Date(date);
    const originalDay = result.getDate();

    result.setDate(1);
    result.setMonth(result.getMonth() + amount);

    const lastDay = new Date(
        result.getFullYear(),
        result.getMonth() + 1,
        0
    ).getDate();

    result.setDate(Math.min(originalDay, lastDay));

    return result;
}


// ===================================
// NUMBER ANIMATION
// ===================================

function setNumber(id, value) {

    const element = document.getElementById(id);
    const formatted = pad(value);

    if (previous[id] !== formatted) {

        element.textContent = formatted;

        element.classList.remove("changed");

        void element.offsetWidth;

        element.classList.add("changed");

        previous[id] = formatted;
    }
}


// ===================================
// MAIN COUNTER
// ===================================

function updateCounter() {

    const now = new Date();

    if (now < startDate) {

        ids.forEach(id => setNumber(id, 0));

        return;
    }

    // Calculate full calendar years.

    let years =
        now.getFullYear() - startDate.getFullYear();

    let cursor = addMonths(startDate, years * 12);

    if (cursor > now) {

        years--;

        cursor = addMonths(startDate, years * 12);
    }


    // Calculate remaining calendar months.

    let months =
        (now.getFullYear() - cursor.getFullYear()) * 12 +
        now.getMonth() - cursor.getMonth();

    let monthCursor = addMonths(cursor, months);

    if (monthCursor > now) {

        months--;

        monthCursor = addMonths(cursor, months);
    }


    // Calculate remaining time.

    let remaining = now - monthCursor;

    const days = Math.floor(
        remaining / 86400000
    );

    remaining -= days * 86400000;

    const hours = Math.floor(
        remaining / 3600000
    );

    remaining -= hours * 3600000;

    const minutes = Math.floor(
        remaining / 60000
    );

    remaining -= minutes * 60000;

    const seconds = Math.floor(
        remaining / 1000
    );


    // Update all six units.

    [
        years,
        months,
        days,
        hours,
        minutes,
        seconds
    ].forEach((value, index) => {

        setNumber(ids[index], value);

    });


    // Total elapsed days.

    const totalDays = Math.floor(
        (now - startDate) / 86400000
    );

    document.getElementById("elapsed").textContent =
        totalDays.toLocaleString() + " days elapsed";


    // Decorative progress animation.

    const progress =
        ((now.getSeconds() % 30) / 30) * 100;

    document.getElementById("progress").style.width =
        progress + "%";
}


// ===================================
// MOUSE FOLLOW LIGHTING
// ===================================

document.querySelectorAll(".unit").forEach(card => {

    card.addEventListener("pointermove", event => {

        const rect = card.getBoundingClientRect();

        card.style.setProperty(
            "--mx",
            (event.clientX - rect.left) + "px"
        );

        card.style.setProperty(
            "--my",
            (event.clientY - rect.top) + "px"
        );

    });

});


// ===================================
// FLOATING PARTICLES
// ===================================

const particleLayer =
    document.getElementById("particles");

for (let i = 0; i < 34; i++) {

    const particle = document.createElement("span");

    particle.className = "particle";

    particle.style.setProperty(
        "--left",
        Math.random() * 100 + "%"
    );

    particle.style.setProperty(
        "--duration",
        (13 + Math.random() * 19) + "s"
    );

    particle.style.setProperty(
        "--delay",
        (-Math.random() * 28) + "s"
    );

    particle.style.setProperty(
        "--drift",
        (Math.random() * 150 - 75) + "px"
    );

    particleLayer.appendChild(particle);
}


// ===================================
// INITIALIZATION
// ===================================

updateCounter();

// Update every second.

setInterval(updateCounter, 1000);


// Hide loading screen and reveal website.

window.addEventListener("load", () => {

    setTimeout(() => {

        document.getElementById("intro")
            .classList.add("hidden");

        document.getElementById("main")
            .classList.add("ready");

    }, 1350);

});

</script>

</body>
</html>
