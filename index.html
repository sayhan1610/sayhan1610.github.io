<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>MavCARD Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #111827;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 18px;
      text-align: center;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .camera-container {
      position: relative;

      width: 100%;

      background: black;

      border-radius: 20px;

      overflow: hidden;
    }

    video {
      display: block;

      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;
    }

    .scan-guide {
      position: absolute;

      left: 5%;
      right: 5%;

      top: 32%;
      height: 36%;

      border: 3px solid white;

      border-radius: 12px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.15);
    }

    .scan-line {
      position: absolute;

      left: 5%;
      right: 5%;

      top: 50%;

      height: 2px;

      background: white;

      opacity: .8;
    }

    #scanButton {
      width: 100%;

      margin-top: 18px;

      padding: 18px;

      border: none;

      border-radius: 16px;

      background: #2563eb;

      color: white;

      font-size: 21px;

      font-weight: 800;

      cursor: pointer;
    }

    #scanButton:disabled {
      background: #374151;
      color: #9ca3af;
    }

    #status {
      margin-top: 12px;

      min-height: 20px;

      color: #9ca3af;

      font-size: 14px;
    }

    #result {
      display: none;

      margin-top: 18px;

      padding: 24px;

      border-radius: 18px;
    }

    #result.success {
      display: block;

      background: #064e3b;

      border: 2px solid #10b981;
    }

    #result.duplicate {
      display: block;

      background: #7f1d1d;

      border: 2px solid #ef4444;
    }

    #result.error {
      display: block;

      background: #78350f;

      border: 2px solid #f59e0b;
    }

    .result-title {
      font-size: 26px;

      font-weight: 900;

      margin-bottom: 12px;
    }

    .barcode {
      font-family: monospace;

      font-size: 20px;

      word-break: break-all;
    }

    .time {
      margin-top: 10px;

      color: #d1d5db;
    }

    #nextButton {
      display: none;

      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;

      border-radius: 14px;

      background: #374151;

      color: white;

      font-size: 18px;

      font-weight: 700;
    }

    .manual {
      margin-top: 25px;

      padding-top: 20px;

      border-top: 1px solid #374151;
    }

    .manual-title {
      color: #9ca3af;

      font-size: 14px;

      margin-bottom: 10px;
    }

    .manual-row {
      display: flex;

      gap: 8px;
    }

    #manualInput {
      flex: 1;

      min-width: 0;

      padding: 14px;

      border: 1px solid #4b5563;

      border-radius: 12px;

      background: #1f2937;

      color: white;

      font-size: 17px;
    }

    #manualButton {
      padding: 14px 18px;

      border: none;

      border-radius: 12px;

      background: #4b5563;

      color: white;

      font-weight: 700;

      font-size: 16px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📇 MavCARD Check-In</h1>

  <div class="subtitle">
    Center the Codabar barcode and press Scan
  </div>


  <div class="camera-container">

    <video
      id="camera"
      autoplay
      playsinline
      muted
    ></video>

    <div class="scan-guide">
      <div class="scan-line"></div>
    </div>

  </div>


  <button
    id="scanButton"
    onclick="scanCurrentFrame()"
    disabled
  >
    📸 SCAN BARCODE
  </button>


  <div id="status">
    Starting camera...
  </div>


  <div id="result"></div>


  <button
    id="nextButton"
    onclick="resetScanner()"
  >
    📸 SCAN NEXT CARD
  </button>


  <div class="manual">

    <div class="manual-title">
      Barcode won't scan? Enter it manually.
    </div>

    <div class="manual-row">

      <input
        id="manualInput"
        type="text"
        inputmode="text"
        placeholder="Barcode"
        autocomplete="off"
      >

      <button
        id="manualButton"
        onclick="manualCheckIn()"
      >
        Check In
      </button>

    </div>

  </div>

</div>


<script>

  /*
   * =====================================================
   * GOOGLE APPS SCRIPT URL
   * =====================================================
   */

  const API_URL =
    "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";


  /*
   * =====================================================
   * VARIABLES
   * =====================================================
   */

  const video =
    document.getElementById("camera");

  const scanButton =
    document.getElementById("scanButton");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const nextButton =
    document.getElementById("nextButton");


  let cameraStream = null;

  let processing = false;


  /*
   * =====================================================
   * START CAMERA
   * =====================================================
   */

  async function startCamera() {

    try {

      status.textContent =
        "Requesting camera...";


      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


      video.srcObject =
        cameraStream;


      await video.play();


      scanButton.disabled =
        false;


      status.textContent =
        "Camera ready • Center the barcode";


    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Camera error: " +
        error.message;

    }

  }


  /*
   * =====================================================
   * CAPTURE + CODABAR SCAN
   * =====================================================
   */

  async function scanCurrentFrame() {

    if (processing) {
      return;
    }


    processing = true;

    scanButton.disabled =
      true;


    status.textContent =
      "📸 Capturing barcode...";


    /*
     * Create a canvas containing the
     * current camera frame.
     */

    const canvas =
      document.createElement("canvas");


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext("2d");


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
     * Convert the captured image to
     * a JPEG file.
     */

    canvas.toBlob(

      async function(blob) {

        if (!blob) {

          scanFailed();

          return;

        }


        status.textContent =
          "🔎 Reading Codabar...";


        const file =
          new File(
            [blob],
            "mavcard.jpg",
            {
              type: "image/jpeg"
            }
          );


        /*
         * Create temporary scanner element.
         */

        const element =
          document.createElement("div");

        element.id =
          "barcode-reader-" +
          Date.now();

        element.style.display =
          "none";

        document.body.appendChild(
          element
        );


        let scanner = null;


        try {

          scanner =
            new Html5Qrcode(
              element.id
            );


          /*
           * IMPORTANT:
           *
           * Explicitly tell the decoder
           * that this is CODABAR.
           */

          const decoded =
            await scanner.scanFile(
              file,
              false
            );


          await scanner.clear();

          element.remove();


          console.log(
            "Decoded barcode:",
            decoded
          );


          if (decoded) {

            checkBarcode(
              decoded
            );

          }

          else {

            scanFailed();

          }

        }

        catch (error) {

          console.log(
            "Codabar scan failed:",
            error
          );


          try {

            if (scanner) {
              await scanner.clear();
            }

          }

          catch (_) {}


          element.remove();


          scanFailed();

        }

      },

      "image/jpeg",

      1.0

    );

  }


  /*
   * =====================================================
   * SCAN FAILED
   * =====================================================
   */

  function scanFailed() {

    processing = false;

    scanButton.disabled =
      false;


    status.textContent =
      "Couldn't find the barcode. Center it inside the box and try again.";

  }


  /*
   * =====================================================
   * GOOGLE CHECK-IN
   * =====================================================
   */

  function checkBarcode(barcode) {

    const callbackName =
      "callback_" +
      Date.now();


    window[callbackName] =
      function(data) {

        handleResult(data);


        delete window[
          callbackName
        ];


        script.remove();

      };


    const script =
      document.createElement(
        "script"
      );


    script.src =
      API_URL +
      "?barcode=" +
      encodeURIComponent(
        barcode
      ) +
      "&callback=" +
      callbackName;


    script.onerror =
      function() {

        delete window[
          callbackName
        ];


        script.remove();


        handleError();

      };


    document.body.appendChild(
      script
    );

  }


  /*
   * =====================================================
   * HANDLE RESULT
   * =====================================================
   */

  function handleResult(data) {

    processing = false;


    result.className =
      "";


    result.style.display =
      "block";


    if (data.success) {

      result.classList.add(
        "success"
      );


      result.innerHTML = `

        <div class="result-title">
          ✅ CHECK-IN SUCCESSFUL
        </div>

        <div class="barcode">
          ${escapeHtml(
            data.barcode
          )}
        </div>

        <div class="time">
          ${escapeHtml(
            data.time
          )}
        </div>

      `;

    }

    else if (data.duplicate) {

      result.classList.add(
        "duplicate"
      );


      result.innerHTML = `

        <div class="result-title">
          ⚠️ ALREADY SCANNED
        </div>

        <div class="barcode">
          ${escapeHtml(
            data.barcode
          )}
        </div>

        <div class="time">
          Original check-in:
          ${escapeHtml(
            data.previousTime
          )}
        </div>

      `;

    }

    else {

      result.classList.add(
        "error"
      );


      result.innerHTML = `

        <div class="result-title">
          ⚠️ ERROR
        </div>

        <div>
          ${escapeHtml(
            data.message
          )}
        </div>

      `;

    }


    scanButton.disabled =
      true;


    nextButton.style.display =
      "block";


    status.textContent =
      "Ready for the next card.";

  }


  /*
   * =====================================================
   * GOOGLE ERROR
   * =====================================================
   */

  function handleError() {

    processing = false;


    result.className =
      "error";


    result.style.display =
      "block";


    result.innerHTML = `

      <div class="result-title">
        ⚠️ CONNECTION ERROR
      </div>

      <div>
        Could not contact the check-in system.
        Please try again.
      </div>

    `;


    scanButton.disabled =
      true;


    nextButton.style.display =
      "block";

  }


  /*
   * =====================================================
   * MANUAL ENTRY
   * =====================================================
   */

  function manualCheckIn() {

    if (processing) {
      return;
    }


    const input =
      document.getElementById(
        "manualInput"
      );


    const barcode =
      input.value.trim();


    if (!barcode) {

      input.focus();

      return;

    }


    processing = true;


    input.disabled =
      true;


    status.textContent =
      "Checking barcode...";


    checkBarcode(
      barcode
    );


    input.value = "";

    input.disabled =
      false;

  }


  /*
   * =====================================================
   * RESET
   * =====================================================
   */

  function resetScanner() {

    result.style.display =
      "none";


    result.className =
      "";


    nextButton.style.display =
      "none";


    processing = false;


    scanButton.disabled =
      false;


    status.textContent =
      "Camera ready • Center the barcode";

  }


  /*
   * =====================================================
   * ESCAPE HTML
   * =====================================================
   */

  function escapeHtml(text) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }


  /*
   * =====================================================
   * START
   * =====================================================
   */

  window.addEventListener(
    "load",
    startCamera
  );


  /*
   * =====================================================
   * ENTER KEY
   * =====================================================
   */

  document
    .getElementById(
      "manualInput"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          manualCheckIn();

        }

      }
    );

</script>

</body>

</html>
