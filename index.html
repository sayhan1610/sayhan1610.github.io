<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
  >

  <title>MavCARD Check-In</title>

  <!-- Barcode scanning library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #111827;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;

      padding: 18px;

      text-align: center;
    }

    /* -----------------------------
       HEADER
    ----------------------------- */

    h1 {
      margin: 8px 0 4px;

      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      color: #9ca3af;

      font-size: 15px;

      margin-bottom: 18px;
    }


    /* -----------------------------
       CAMERA
    ----------------------------- */

    .camera-container {
      position: relative;

      width: 100%;

      background: #000;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35);
    }

    video {
      display: block;

      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;
    }


    /* -----------------------------
       BARCODE GUIDE
    ----------------------------- */

    .scan-guide {
      position: absolute;

      left: 8%;
      right: 8%;

      top: 35%;

      height: 30%;

      border: 3px solid white;

      border-radius: 12px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.15);
    }

    .scan-line {
      position: absolute;

      left: 10%;
      right: 10%;

      top: 50%;

      height: 2px;

      background: white;

      opacity: 0.8;
    }


    /* -----------------------------
       SCAN BUTTON
    ----------------------------- */

    #scanButton {
      width: 100%;

      margin-top: 18px;

      padding: 18px;

      border: none;

      border-radius: 16px;

      background: #2563eb;

      color: white;

      font-size: 21px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 5px 15px rgba(37, 99, 235, 0.3);
    }

    #scanButton:active {
      transform: scale(0.98);
    }

    #scanButton:disabled {
      background: #374151;

      color: #9ca3af;

      cursor: not-allowed;

      box-shadow: none;
    }


    /* -----------------------------
       STATUS
    ----------------------------- */

    #status {
      margin-top: 12px;

      color: #9ca3af;

      font-size: 14px;

      min-height: 20px;
    }


    /* -----------------------------
       RESULT
    ----------------------------- */

    #result {
      display: none;

      margin-top: 18px;

      padding: 24px;

      border-radius: 18px;
    }

    #result.success {
      display: block;

      background: #064e3b;

      border: 2px solid #10b981;
    }

    #result.duplicate {
      display: block;

      background: #7f1d1d;

      border: 2px solid #ef4444;
    }

    #result.error {
      display: block;

      background: #78350f;

      border: 2px solid #f59e0b;
    }

    .result-title {
      font-size: 26px;

      font-weight: 900;

      margin-bottom: 12px;
    }

    .barcode {
      font-family: monospace;

      font-size: 20px;

      word-break: break-all;
    }

    .time {
      margin-top: 10px;

      color: #d1d5db;

      font-size: 15px;
    }


    /* -----------------------------
       RESET BUTTON
    ----------------------------- */

    #nextButton {
      display: none;

      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;

      border-radius: 14px;

      background: #374151;

      color: white;

      font-size: 18px;

      font-weight: 700;

      cursor: pointer;
    }


    /* -----------------------------
       MANUAL ENTRY
    ----------------------------- */

    .manual {
      margin-top: 25px;

      padding-top: 20px;

      border-top: 1px solid #374151;
    }

    .manual-title {
      color: #9ca3af;

      font-size: 14px;

      margin-bottom: 10px;
    }

    .manual-row {
      display: flex;

      gap: 8px;
    }

    #manualInput {
      flex: 1;

      min-width: 0;

      padding: 14px;

      border: 1px solid #4b5563;

      border-radius: 12px;

      background: #1f2937;

      color: white;

      font-size: 17px;
    }

    #manualButton {
      padding: 14px 18px;

      border: none;

      border-radius: 12px;

      background: #4b5563;

      color: white;

      font-weight: 700;

      font-size: 16px;
    }


    /* -----------------------------
       HIDDEN CANVAS
    ----------------------------- */

    #captureCanvas {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📇 MavCARD Check-In</h1>

  <div class="subtitle">
    Point the camera at the barcode, then press Scan
  </div>


  <!-- CAMERA -->

  <div class="camera-container">

    <video
      id="camera"
      autoplay
      playsinline
      muted
    ></video>

    <div class="scan-guide">
      <div class="scan-line"></div>
    </div>

  </div>


  <!-- SCAN BUTTON -->

  <button
    id="scanButton"
    onclick="captureAndScan()"
    disabled
  >
    📸 SCAN BARCODE
  </button>


  <div id="status">
    Starting camera...
  </div>


  <!-- RESULT -->

  <div id="result"></div>


  <!-- NEXT -->

  <button
    id="nextButton"
    onclick="resetScanner()"
  >
    📸 SCAN NEXT CARD
  </button>


  <!-- MANUAL -->

  <div class="manual">

    <div class="manual-title">
      Barcode won't scan? Enter it manually.
    </div>

    <div class="manual-row">

      <input
        id="manualInput"
        type="text"
        inputmode="numeric"
        placeholder="Barcode number"
        autocomplete="off"
      >

      <button
        id="manualButton"
        onclick="manualCheckIn()"
      >
        Check In
      </button>

    </div>

  </div>


  <!-- HIDDEN CANVAS -->

  <canvas id="captureCanvas"></canvas>

</div>


<script>

  /* =====================================================
     CONFIGURATION
  ===================================================== */

  const API_URL =
    "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";


  /* =====================================================
     VARIABLES
  ===================================================== */

  const video =
    document.getElementById("camera");

  const canvas =
    document.getElementById("captureCanvas");

  const scanButton =
    document.getElementById("scanButton");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const nextButton =
    document.getElementById("nextButton");

  let cameraStream = null;

  let processing = false;


  /* =====================================================
     START CAMERA
  ===================================================== */

  async function startCamera() {

    try {

      status.textContent =
        "Requesting camera...";


      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


      video.srcObject =
        cameraStream;


      await video.play();


      scanButton.disabled = false;

      status.textContent =
        "Camera ready • Line up the barcode";


    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Camera error: " + error.message;

    }

  }


  /* =====================================================
     CAPTURE IMAGE
  ===================================================== */

  async function captureAndScan() {

    if (processing) {
      return;
    }

    processing = true;

    scanButton.disabled = true;

    status.textContent =
      "📸 Capturing image...";


    try {

      /*
       * Capture the current video frame.
       */

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      const context =
        canvas.getContext("2d");

/*
 * Capture the full-resolution camera frame.
 */
context.drawImage(
  video,
  0,
  0,
  canvas.width,
  canvas.height
);

/*
 * Increase contrast slightly.
 * This can help with small printed barcodes.
 */
const image =
  context.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

const pixels =
  image.data;

for (
  let i = 0;
  i < pixels.length;
  i += 4
) {

  const brightness =
    0.299 * pixels[i] +
    0.587 * pixels[i + 1] +
    0.114 * pixels[i + 2];

  if (brightness > 160) {

    pixels[i] = 255;
    pixels[i + 1] = 255;
    pixels[i + 2] = 255;

  }

  else if (brightness < 90) {

    pixels[i] = 0;
    pixels[i + 1] = 0;
    pixels[i + 2] = 0;

  }

}

context.putImageData(
  image,
  0,
  0
);


      status.textContent =
        "🔎 Looking for barcode...";


      /*
       * Try native BarcodeDetector first.
       */

      let barcode =
        await tryNativeBarcodeDetector();


      /*
       * If the browser doesn't support
       * BarcodeDetector or it couldn't find
       * anything, use html5-qrcode.
       */

      if (!barcode) {

        barcode =
          await tryHtml5QrCode();

      }


      if (barcode) {

        status.textContent =
          "Barcode found • Checking...";

        checkBarcode(barcode);

      }

      else {

        processing = false;

        scanButton.disabled = false;

        status.textContent =
          "Couldn't find a barcode. Move closer, improve lighting, and try again.";

      }

    }

    catch (error) {

      console.error(error);

      processing = false;

      scanButton.disabled = false;

      status.textContent =
        "Couldn't read the barcode. Try again.";

    }

  }


  /* =====================================================
     NATIVE BARCODE DETECTOR
  ===================================================== */

  async function tryNativeBarcodeDetector() {

    /*
     * BarcodeDetector isn't available
     * on every browser.
     */

    if (!("BarcodeDetector" in window)) {

      return null;

    }


    try {

      const formats =
        await BarcodeDetector.getSupportedFormats();


      /*
       * We only care about 1D barcodes.
       */

      const wantedFormats = [

        "code_128",
        "code_39",
        "code_93",
        "codabar",
        "ean_13",
        "ean_8",
        "itf",
        "upc_a",
        "upc_e"

      ];


      const supported =
        wantedFormats.filter(
          format => formats.includes(format)
        );


      if (supported.length === 0) {

        return null;

      }


      const detector =
        new BarcodeDetector({
          formats: supported
        });


      const barcodes =
        await detector.detect(canvas);


      if (
        barcodes &&
        barcodes.length > 0
      ) {

        return barcodes[0].rawValue;

      }

    }

    catch (error) {

      console.log(
        "Native BarcodeDetector failed:",
        error
      );

    }


    return null;

  }


  /* =====================================================
     HTML5-QRCODE IMAGE SCANNER
  ===================================================== */

 async function tryHtml5QrCode() {

  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.98
    );

  // Create temporary element FIRST
  const temp =
    document.createElement("div");

  temp.id =
    "reader-placeholder-" + Date.now();

  temp.style.position = "fixed";
  temp.style.left = "-9999px";
  temp.style.top = "-9999px";
  temp.style.width = "1px";
  temp.style.height = "1px";

  document.body.appendChild(temp);

  let scanner = null;

  try {

    // Now create the scanner
    scanner =
      new Html5Qrcode(
        temp.id,
        {
          verbose: false
        }
      );

    const file =
      dataURLToFile(
        imageData,
        "mavcard.jpg"
      );

    /*
     * scanFile() uses the barcode decoder
     * against the captured image.
     *
     * We deliberately don't restrict the
     * barcode formats here.
     */
    const decoded =
      await scanner.scanFile(
        file,
        false
      );

    await scanner.clear();

    temp.remove();

    console.log(
      "Barcode decoded:",
      decoded
    );

    return decoded;

  }

  catch (error) {

    console.log(
      "html5-qrcode scan failed:",
      error
    );

    try {

      if (scanner) {
        await scanner.clear();
      }

    }

    catch (_) {}

    temp.remove();

    return null;

  }

}

  /* =====================================================
     DATA URL → FILE
  ===================================================== */

  function dataURLToFile(
    dataURL,
    filename
  ) {

    const parts =
      dataURL.split(",");

    const mime =
      parts[0]
        .match(/:(.*?);/)[1];

    const binary =
      atob(parts[1]);

    const array =
      new Uint8Array(
        binary.length
      );


    for (
      let i = 0;
      i < binary.length;
      i++
    ) {

      array[i] =
        binary.charCodeAt(i);

    }


    return new File(
      [array],
      filename,
      {
        type: mime
      }
    );

  }


  /* =====================================================
     CHECK BARCODE WITH GOOGLE
  ===================================================== */

  function checkBarcode(barcode) {

    const callbackName =
      "callback_" +
      Date.now();


    window[callbackName] =
      function(data) {

        handleResult(data);

        delete window[callbackName];

        script.remove();

      };


    const script =
      document.createElement("script");


    script.src =
      API_URL +
      "?barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callbackName;


    script.onerror =
      function() {

        delete window[callbackName];

        script.remove();

        handleError();

      };


    document.body.appendChild(script);

  }


  /* =====================================================
     RESULT
  ===================================================== */

  function handleResult(data) {

    processing = false;


    result.className = "";

    result.style.display =
      "block";


    if (data.success) {

      result.classList.add(
        "success"
      );


      result.innerHTML = `

        <div class="result-title">
          ✅ CHECK-IN SUCCESSFUL
        </div>

        <div class="barcode">
          ${escapeHtml(data.barcode)}
        </div>

        <div class="time">
          ${escapeHtml(data.time)}
        </div>

      `;

    }


    else if (data.duplicate) {

      result.classList.add(
        "duplicate"
      );


      result.innerHTML = `

        <div class="result-title">
          ⚠️ ALREADY SCANNED
        </div>

        <div class="barcode">
          ${escapeHtml(data.barcode)}
        </div>

        <div class="time">
          Original check-in:
          ${escapeHtml(data.previousTime)}
        </div>

      `;

    }


    else {

      result.classList.add(
        "error"
      );


      result.innerHTML = `

        <div class="result-title">
          ⚠️ ERROR
        </div>

        <div>
          ${escapeHtml(data.message)}
        </div>

      `;

    }


    scanButton.disabled = true;

    nextButton.style.display =
      "block";


    status.textContent =
      "Ready for the next card.";

  }


  /* =====================================================
     ERROR
  ===================================================== */

  function handleError() {

    processing = false;


    result.className =
      "error";


    result.style.display =
      "block";


    result.innerHTML = `

      <div class="result-title">
        ⚠️ CONNECTION ERROR
      </div>

      <div>
        Could not contact the check-in system.
        Please try again.
      </div>

    `;


    scanButton.disabled = true;

    nextButton.style.display =
      "block";

  }


  /* =====================================================
     MANUAL CHECK-IN
  ===================================================== */

  function manualCheckIn() {

    if (processing) {
      return;
    }


    const input =
      document.getElementById(
        "manualInput"
      );


    const barcode =
      input.value.trim();


    if (!barcode) {

      input.focus();

      return;

    }


    processing = true;

    input.disabled = true;


    status.textContent =
      "Checking barcode...";


    checkBarcode(barcode);


    input.value = "";

    input.disabled = false;

  }


  /* =====================================================
     RESET
  ===================================================== */

  function resetScanner() {

    result.style.display =
      "none";


    result.className =
      "";


    nextButton.style.display =
      "none";


    processing = false;


    scanButton.disabled =
      false;


    status.textContent =
      "Camera ready • Line up the barcode";

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }


  /* =====================================================
     START
  ===================================================== */

  window.addEventListener(
    "load",
    startCamera
  );


  /* =====================================================
     ENTER KEY FOR MANUAL ENTRY
  ===================================================== */

  document
    .getElementById("manualInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          manualCheckIn();

        }

      }
    );

</script>

</body>

</html>
