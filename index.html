<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
  >

  <title>MavCARD Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #111827;
      color: white;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;

      padding: 20px;

      text-align: center;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;

      margin: 0 auto;

      border-radius: 18px;
      overflow: hidden;

      background: black;
    }

    #result {
      margin-top: 20px;
      padding: 22px;

      border-radius: 18px;

      display: none;
    }

    #result.success {
      display: block;
      background: #064e3b;
      border: 2px solid #10b981;
    }

    #result.duplicate {
      display: block;
      background: #7f1d1d;
      border: 2px solid #ef4444;
    }

    #result.error {
      display: block;
      background: #78350f;
      border: 2px solid #f59e0b;
    }

    .result-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .barcode {
      font-family: monospace;
      font-size: 19px;

      word-break: break-all;
    }

    .time {
      margin-top: 8px;
      color: #d1d5db;
    }

    button {
      width: 100%;
      margin-top: 16px;

      padding: 16px;

      border: none;
      border-radius: 14px;

      background: #2563eb;
      color: white;

      font-size: 18px;
      font-weight: 700;
    }

    button:active {
      transform: scale(.98);
    }

    .status {
      margin-top: 15px;

      color: #9ca3af;

      font-size: 14px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>📇 MavCARD Check-In</h1>

    <div class="subtitle">
      Scan the barcode on the back of the MavCARD
    </div>

    <div id="reader"></div>

    <div id="result"></div>

    <button
      id="restart"
      onclick="restartScanner()"
      style="display:none;"
    >
      Scan Next Card
    </button>

    <div
      class="status"
      id="status"
    >
      Starting camera...
    </div>

  </div>


<script>

  // =====================================================
  // PUT YOUR GOOGLE APPS SCRIPT /exec URL HERE
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzmcB48boLtRRmLafZzvT4Np8dM0esh0AVOk1mFGCqAgCtrjXm9xEEGp7ZXCyTg9nQM/exec";


  let scanner = null;
  let scanning = false;
  let processing = false;


  // -----------------------------------------------------
  // START CAMERA
  // -----------------------------------------------------

  function startScanner() {

    scanner = new Html5Qrcode("reader");

    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 320,
          height: 160
        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF

        ]

      },

      onScanSuccess,

      onScanFailure

    )

    .then(() => {

      scanning = true;

      document.getElementById("status")
        .textContent =
        "Camera ready • Scan a MavCARD";

    })

    .catch(error => {

      document.getElementById("status")
        .textContent =
        "Camera error: " + error;

    });

  }


  // -----------------------------------------------------
  // BARCODE SCANNED
  // -----------------------------------------------------

  function onScanSuccess(decodedText) {

    if (!scanning || processing) {
      return;
    }

    processing = true;

    scanner.stop()
      .then(() => {

        scanning = false;

        document.getElementById("status")
          .textContent =
          "Checking barcode...";

        checkBarcode(decodedText);

      });

  }


  function onScanFailure(error) {
    // Normal scanning failures are ignored.
  }


  // -----------------------------------------------------
  // SEND BARCODE TO GOOGLE APPS SCRIPT
  // -----------------------------------------------------

  function checkBarcode(barcode) {

    const callbackName =
      "callback_" + Date.now();

    window[callbackName] =
      function(result) {

        handleResult(result);

        delete window[callbackName];

        script.remove();

      };


    const script =
      document.createElement("script");

    script.src =
      API_URL +
      "?barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callbackName;


    script.onerror =
      function() {

        delete window[callbackName];

        script.remove();

        handleError();

      };


    document.body.appendChild(script);

  }


  // -----------------------------------------------------
  // HANDLE GOOGLE RESPONSE
  // -----------------------------------------------------

  function handleResult(result) {

    const box =
      document.getElementById("result");

    box.className = "";

    box.style.display = "block";


    if (result.success) {

      box.classList.add("success");

      box.innerHTML = `

        <div class="result-title">
          ✅ CHECK-IN SUCCESSFUL
        </div>

        <div class="barcode">
          ${escapeHtml(result.barcode)}
        </div>

        <div class="time">
          ${escapeHtml(result.time)}
        </div>

      `;

    }

    else if (result.duplicate) {

      box.classList.add("duplicate");

      box.innerHTML = `

        <div class="result-title">
          ⚠️ ALREADY SCANNED
        </div>

        <div class="barcode">
          ${escapeHtml(result.barcode)}
        </div>

        <div class="time">
          Original check-in:
          ${escapeHtml(result.previousTime)}
        </div>

      `;

    }

    else {

      box.classList.add("error");

      box.innerHTML = `

        <div class="result-title">
          ⚠️ ERROR
        </div>

        <div>
          ${escapeHtml(result.message)}
        </div>

      `;

    }


    document.getElementById("restart")
      .style.display = "block";

    processing = false;

  }


  // -----------------------------------------------------
  // ERROR
  // -----------------------------------------------------

  function handleError() {

    const box =
      document.getElementById("result");

    box.className = "error";

    box.style.display = "block";

    box.innerHTML = `

      <div class="result-title">
        ⚠️ CONNECTION ERROR
      </div>

      <div>
        Could not contact the check-in system.
        Please try again.
      </div>

    `;


    document.getElementById("restart")
      .style.display = "block";

    processing = false;

  }


  // -----------------------------------------------------
  // RESTART
  // -----------------------------------------------------

  function restartScanner() {

    document.getElementById("result")
      .style.display = "none";

    document.getElementById("restart")
      .style.display = "none";

    document.getElementById("status")
      .textContent =
      "Starting camera...";

    processing = false;

    startScanner();

  }


  // -----------------------------------------------------
  // BASIC HTML SAFETY
  // -----------------------------------------------------

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // -----------------------------------------------------
  // START
  // -----------------------------------------------------

  window.onload = startScanner;

</script>

</body>

</html>
