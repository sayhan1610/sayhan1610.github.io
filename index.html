<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
  >

  <title>MavCARD Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #111827;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 18px;
      text-align: center;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 18px;
      font-size: 15px;
    }

    #reader {
      width: 100%;
      max-width: 550px;
      margin: auto;

      overflow: hidden;

      border-radius: 18px;

      background: black;
    }

    /*
     * Hide the library's own text/buttons.
     * We want our own clean interface.
     */

    #reader__dashboard {
      display: none !important;
    }

    #reader__scan_region {
      background: black !important;
    }

    #reader__scan_region video {
      width: 100% !important;
      border-radius: 18px;
    }

    #status {
      margin-top: 14px;

      min-height: 22px;

      color: #9ca3af;

      font-size: 14px;
    }

    #result {
      display: none;

      margin-top: 18px;

      padding: 24px;

      border-radius: 18px;
    }

    #result.success {
      display: block;

      background: #064e3b;

      border: 2px solid #10b981;
    }

    #result.duplicate {
      display: block;

      background: #7f1d1d;

      border: 2px solid #ef4444;
    }

    #result.error {
      display: block;

      background: #78350f;

      border: 2px solid #f59e0b;
    }

    .result-title {
      font-size: 26px;
      font-weight: 900;

      margin-bottom: 12px;
    }

    .barcode {
      font-family: monospace;
      font-size: 20px;

      word-break: break-all;
    }

    .time {
      margin-top: 10px;

      color: #d1d5db;
    }

    #nextButton {
      display: none;

      width: 100%;

      margin-top: 14px;

      padding: 17px;

      border: none;

      border-radius: 14px;

      background: #2563eb;

      color: white;

      font-size: 19px;

      font-weight: 800;
    }

    .manual {
      margin-top: 25px;

      padding-top: 20px;

      border-top: 1px solid #374151;
    }

    .manual-title {
      color: #9ca3af;

      font-size: 14px;

      margin-bottom: 10px;
    }

    .manual-row {
      display: flex;

      gap: 8px;
    }

    #manualInput {
      flex: 1;

      min-width: 0;

      padding: 14px;

      border: 1px solid #4b5563;

      border-radius: 12px;

      background: #1f2937;

      color: white;

      font-size: 17px;

      outline: none;
    }

    #manualButton {
      padding: 14px 18px;

      border: none;

      border-radius: 12px;

      background: #4b5563;

      color: white;

      font-weight: 700;

      font-size: 16px;
    }

    #manualButton:active,
    #nextButton:active {
      transform: scale(.98);
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📇 MavCARD Check-In</h1>

  <div class="subtitle">
    Point the camera at the barcode
  </div>


  <!-- CAMERA -->

  <div id="reader"></div>


  <div id="status">
    Starting camera...
  </div>


  <!-- RESULT -->

  <div id="result"></div>


  <!-- NEXT CARD -->

  <button
    id="nextButton"
    onclick="startNextScan()"
  >
    📷 SCAN NEXT CARD
  </button>


  <!-- MANUAL ENTRY -->

  <div class="manual">

    <div class="manual-title">
      Can't scan? Enter the barcode manually.
    </div>

    <div class="manual-row">

      <input
        id="manualInput"
        type="text"
        inputmode="numeric"
        placeholder="Barcode number"
        autocomplete="off"
      >

      <button
        id="manualButton"
        onclick="manualCheckIn()"
      >
        Check In
      </button>

    </div>

  </div>

</div>


<script>

  /*
   * =====================================================
   * GOOGLE APPS SCRIPT ENDPOINT
   * =====================================================
   *
   * PUT YOUR /exec URL HERE.
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyx9oD0IOgvN-naQz1KHrmBqItZzTIO2E61skzGIRSTqSl1Yxh4ooaFi5aXw6IrQSzi/exec";


  /*
   * =====================================================
   * SCANNER
   * =====================================================
   */

  let scanner = null;

  let processing = false;


  /*
   * =====================================================
   * START SCANNER
   * =====================================================
   */

  function startScanner() {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * Explicitly prioritize Codabar.
     */

    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        /*
         * Codabar is wide and short,
         * so give it a wide scanning box.
         */

        const width =
          Math.min(
            viewfinderWidth * 0.90,
            500
          );

        const height =
          Math.min(
            viewfinderHeight * 0.35,
            180
          );

        return {
          width: width,
          height: height
        };

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODABAR

      ]

    };


    scanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      config,

      function(decodedText) {

        handleScan(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Normal scanning failures are ignored.
         */

      }

    )

    .then(() => {

      document.getElementById(
        "status"
      ).textContent =
        "Camera ready • Center the barcode";


    })

    .catch(error => {

      console.error(error);

      document.getElementById(
        "status"
      ).textContent =
        "Camera error: " +
        error;

    });

  }


  /*
   * =====================================================
   * BARCODE FOUND
   * =====================================================
   */

  function handleScan(
    barcode
  ) {

    if (processing) {
      return;
    }


    processing = true;


    /*
     * Stop the camera immediately.
     *
     * This prevents the same barcode
     * from being submitted multiple times.
     */

    if (scanner) {

      scanner
        .stop()
        .catch(() => {});

    }


    document.getElementById(
      "status"
    ).textContent =
      "Barcode found • Checking...";


    checkBarcode(
      barcode
    );

  }


  /*
   * =====================================================
   * SEND TO GOOGLE
   * =====================================================
   */

  function checkBarcode(
    barcode
  ) {

    const callbackName =
      "checkInCallback_" +
      Date.now();


    const script =
      document.createElement(
        "script"
      );


    window[
      callbackName
    ] = function(data) {

      handleResult(
        data
      );


      delete window[
        callbackName
      ];


      script.remove();

    };


    script.onerror =
      function() {

        delete window[
          callbackName
        ];


        script.remove();


        handleError();

      };


    script.src =
      API_URL +
      "?barcode=" +
      encodeURIComponent(
        barcode
      ) +
      "&callback=" +
      callbackName;


    document.body.appendChild(
      script
    );

  }


  /*
   * =====================================================
   * RESULT
   * =====================================================
   */

  function handleResult(
    data
  ) {

    const box =
      document.getElementById(
        "result"
      );


    box.className =
      "";


    box.style.display =
      "block";


    if (data.success) {

      box.classList.add(
        "success"
      );


      box.innerHTML = `

        <div class="result-title">
          ✅ CHECK-IN SUCCESSFUL
        </div>

        <div class="barcode">
          ${escapeHtml(
            data.barcode
          )}
        </div>

        <div class="time">
          ${escapeHtml(
            data.time
          )}
        </div>

      `;

    }


    else if (data.duplicate) {

      box.classList.add(
        "duplicate"
      );


      box.innerHTML = `

        <div class="result-title">
          ⚠️ ALREADY SCANNED
        </div>

        <div class="barcode">
          ${escapeHtml(
            data.barcode
          )}
        </div>

        <div class="time">
          Original check-in:
          ${escapeHtml(
            data.previousTime
          )}
        </div>

      `;

    }


    else {

      box.classList.add(
        "error"
      );


      box.innerHTML = `

        <div class="result-title">
          ⚠️ ERROR
        </div>

        <div>
          ${escapeHtml(
            data.message
          )}
        </div>

      `;

    }


    document.getElementById(
      "nextButton"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "Ready for the next card.";

  }


  /*
   * =====================================================
   * CONNECTION ERROR
   * =====================================================
   */

  function handleError() {

    const box =
      document.getElementById(
        "result"
      );


    box.className =
      "error";


    box.style.display =
      "block";


    box.innerHTML = `

      <div class="result-title">
        ⚠️ CONNECTION ERROR
      </div>

      <div>
        Could not contact the check-in system.
      </div>

    `;


    document.getElementById(
      "nextButton"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "Please try again.";

  }


  /*
   * =====================================================
   * NEXT CARD
   * =====================================================
   */

  function startNextScan() {

    document.getElementById(
      "result"
    ).style.display =
      "none";


    document.getElementById(
      "result"
    ).className =
      "";


    document.getElementById(
      "nextButton"
    ).style.display =
      "none";


    processing = false;


    document.getElementById(
      "status"
    ).textContent =
      "Starting camera...";


    /*
     * Clear old scanner instance.
     */

    if (scanner) {

      scanner
        .clear()
        .catch(() => {});

    }


    /*
     * Give the camera a moment
     * before starting again.
     */

    setTimeout(
      startScanner,
      300
    );

  }


  /*
   * =====================================================
   * MANUAL ENTRY
   * =====================================================
   */

  function manualCheckIn() {

    if (processing) {
      return;
    }


    const input =
      document.getElementById(
        "manualInput"
      );


    const barcode =
      input.value.trim();


    if (!barcode) {

      input.focus();

      return;

    }


    processing = true;


    document.getElementById(
      "status"
    ).textContent =
      "Checking barcode...";


    /*
     * Stop camera if running.
     */

    if (scanner) {

      scanner
        .stop()
        .catch(() => {});

    }


    input.value = "";


    checkBarcode(
      barcode
    );

  }


  /*
   * =====================================================
   * ENTER KEY
   * =====================================================
   */

  document
    .getElementById(
      "manualInput"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          manualCheckIn();

        }

      }
    );


  /*
   * =====================================================
   * HTML ESCAPING
   * =====================================================
   */

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }


  /*
   * =====================================================
   * START ON PAGE LOAD
   * =====================================================
   */

  window.addEventListener(
    "load",
    startScanner
  );

</script>

</body>

</html>
